{# Global command palette — included from layout.html (authenticated shell only) #}
<style>
    /* Command palette — scoped visuals & motion */
    #command-palette-backdrop {
        opacity: 0;
        pointer-events: none;
        transition: opacity 320ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    #command-palette-backdrop.cp-palette-visible {
        opacity: 1;
        pointer-events: auto;
    }

    #command-palette-modal {
        opacity: 0;
        transform: translate(-50%, -8px) scale(0.97);
        pointer-events: none;
        background-color: rgb(255 255 255);
        border: 1px solid rgb(226 232 240);
        transition:
            opacity 320ms cubic-bezier(0.16, 1, 0.3, 1),
            transform 380ms cubic-bezier(0.16, 1, 0.3, 1),
            box-shadow 320ms ease;
        box-shadow: 0 25px 50px -12px rgb(15 23 42 / 0.2);
    }
    #command-palette-modal.cp-palette-visible {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
        pointer-events: auto;
        box-shadow:
            0 25px 50px -12px rgb(15 23 42 / 0.22),
            0 0 0 1px rgb(255 255 255) inset;
    }

    #command-palette-panel-inner.cp-panel-reveal-active {
        animation: cp-panel-reveal 0.42s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes cp-panel-reveal {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .command-palette-row {
        transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.2s ease;
    }
    .command-palette-row-active {
        background-color: rgb(238 242 255);
        border-left-color: rgb(114 90 234) !important;
        box-shadow: inset 0 1px 0 rgb(255 255 255);
    }

    .command-palette-row-in {
        animation: cp-row-in 0.38s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }
    @keyframes cp-row-in {
        from {
            opacity: 0;
            transform: translateX(-6px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    /* Search field: soft border only — avoids harsh / “black” edges from rings + transparency */
    #command-palette-search-wrap {
        border: 1px solid rgb(226 232 240);
        background-color: rgb(255 255 255);
        box-shadow: 0 1px 2px 0 rgb(15 23 42 / 0.04);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }
    #command-palette-search-wrap:focus-within {
        border-color: rgb(165 180 252);
        box-shadow: 0 0 0 3px rgb(199 210 254 / 0.65);
        background-color: rgb(255 255 255);
    }

    #command-palette-input:focus {
        outline: none;
        box-shadow: none;
    }

    /* Solid sheet: list area always reads on white */
    #command-palette-results {
        background-color: rgb(255 255 255);
    }

    .cp-kbd {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.02em;
        padding: 2px 6px;
        border-radius: 6px;
        background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
        border: 1px solid rgba(148, 163, 184, 0.45);
        color: #64748b;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset;
    }

    #command-palette-panel-inner input,
    #command-palette-panel-inner select,
    #command-palette-panel-inner textarea {
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    #command-palette-panel-inner input:focus,
    #command-palette-panel-inner select:focus,
    #command-palette-panel-inner textarea:focus {
        border-color: rgba(114, 90, 234, 0.45);
        box-shadow: 0 0 0 3px rgba(114, 90, 234, 0.12);
        outline: none;
    }
    #command-palette-panel-inner button[type="submit"] {
        transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.2s ease;
    }
    #command-palette-panel-inner button[type="submit"]:active:not(:disabled) {
        transform: scale(0.98);
    }

    @media (prefers-reduced-motion: reduce) {
        #command-palette-backdrop,
        #command-palette-modal {
            transition-duration: 0.05s;
        }
        .command-palette-row,
        .command-palette-row-in {
            animation: none !important;
            transition: none;
        }
        #command-palette-panel-inner.cp-panel-reveal-active {
            animation: none !important;
        }
    }

    /* Action form only: centered card, no list chrome */
    #command-palette-modal.cp-action-sheet {
        width: min(520px, calc(100vw - 2rem)) !important;
        max-height: 90vh;
    }
    #command-palette-modal.cp-action-sheet.cp-palette-visible {
        top: 50%;
        transform: translate(-50%, -50%) scale(1);
    }
    #command-palette-panel.cp-panel-floating {
        border-top: none;
        border: 1px solid rgb(226 232 240);
        border-radius: 1rem;
        margin: 1rem;
        max-height: min(85vh, 520px);
        box-shadow:
            0 25px 50px -12px rgb(15 23 42 / 0.18),
            0 0 0 1px rgb(255 255 255) inset;
    }
</style>

<div id="command-palette-backdrop"
     class="hidden fixed inset-0 z-[200] bg-slate-900/55 backdrop-blur-[2px]"
     aria-hidden="true"></div>
<div id="command-palette-modal"
     class="hidden fixed left-1/2 top-[10vh] z-[201] w-[min(680px,calc(100vw-1.25rem))] max-h-[88vh] flex flex-col rounded-2xl overflow-hidden"
     role="dialog"
     aria-modal="true"
     aria-labelledby="command-palette-title">
    <div id="command-palette-header" class="px-4 pt-4 pb-3 shrink-0 border-b border-slate-200 bg-slate-50">
        <label id="command-palette-title" class="sr-only">Command palette</label>
        <div id="command-palette-search-wrap"
             class="flex items-center gap-3 rounded-xl px-3 py-2.5">
            <svg class="w-5 h-5 text-primary_purp/80 shrink-0 transition-transform duration-300 group-focus-within:scale-105" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
            </svg>
            <input type="text"
                   id="command-palette-input"
                   autocomplete="off"
                   spellcheck="false"
                   placeholder="Try /n scores · /a add unit · /gr - algorithms · /help"
                   class="flex-1 min-w-0 py-1.5 text-sm text-slate-900 placeholder:text-slate-400 border-0 bg-transparent focus:ring-0 roboto-regular" />
        </div>
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1.5 mt-3 text-[11px] text-slate-600 roboto-regular">
            <span class="inline-flex items-center gap-1"><span class="cp-kbd">/n</span><span class="text-slate-400">nav</span></span>
            <span class="inline-flex items-center gap-1"><span class="cp-kbd">/a</span><span class="text-slate-400">actions</span></span>
            <span class="inline-flex items-center gap-1"><span class="cp-kbd">/gr</span><span class="text-slate-400">groups</span></span>
            <span class="inline-flex items-center gap-1"><span class="cp-kbd">/help</span><span class="text-slate-400">commands</span></span>
            <span class="text-slate-300">·</span>
            <span class="inline-flex items-center gap-1.5"><span class="cp-kbd">↑</span><span class="cp-kbd">↓</span><span class="text-slate-400">select</span></span>
            <span class="inline-flex items-center gap-1.5"><span class="cp-kbd">Enter</span><span class="text-slate-400">run</span></span>
            <span class="inline-flex items-center gap-1.5"><span class="cp-kbd">Ctrl</span><span class="text-slate-400">/</span><span class="cp-kbd">⌘</span><span class="cp-kbd">K</span><span class="text-slate-400">·</span><span class="text-slate-400">toggle</span></span>
            <span class="inline-flex items-center gap-1.5"><span class="cp-kbd">Esc</span><span class="text-slate-400">close · back out of form</span></span>
        </div>
    </div>
    <div id="command-palette-results"
         class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden text-sm scroll-smooth cp-results-scroll"
         style="scrollbar-width: thin; scrollbar-color: rgba(114,90,234,0.35) transparent;"
         role="listbox"
         aria-label="Results"></div>
    <div id="command-palette-panel"
         class="hidden border-t border-slate-200 bg-white max-h-[46vh] overflow-hidden shrink-0">
        <div id="command-palette-panel-inner" class="p-4 overflow-y-auto max-h-[46vh] bg-white"></div>
    </div>
</div>
