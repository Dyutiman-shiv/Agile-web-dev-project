{% extends "layout.html" %}
{% block title %}Notifications{% endblock %}

{% block page_content %}
<div class="max-w-2xl mx-auto space-y-6 animate-fade-in">

    <!-- Header -->
    <div class="flex items-center justify-between">
        <h2 class="text-xl montserrat-semi-bold text-gray-800 flex items-center gap-2">
            <svg class="w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
            </svg>
            Notifications
        </h2>
        <div class="flex items-center gap-2">
            <button id="mark-all-read-btn" class="text-sm text-indigo-600 hover:text-indigo-800 transition-colors px-3 py-1.5 rounded-lg hover:bg-indigo-50">
                Mark all read
            </button>
            <button id="clear-read-btn" class="text-sm text-gray-500 hover:text-red-600 transition-colors px-3 py-1.5 rounded-lg hover:bg-red-50">
                Clear read
            </button>
        </div>
    </div>

    <!-- Filter tabs -->
    <div class="flex bg-white rounded-xl shadow-sm border border-gray-100 p-1 gap-1 w-fit">
        <button class="notif-filter-btn px-4 py-1.5 text-sm rounded-lg bg-indigo-600 text-white shadow" data-filter="all">All</button>
        <button class="notif-filter-btn px-4 py-1.5 text-sm rounded-lg text-gray-600 hover:bg-gray-100" data-filter="unread">Unread</button>
    </div>

    <!-- Notification list -->
    <div id="notif-page-list" class="space-y-2">
        <div class="py-12 text-center text-gray-400 text-sm">Loading...</div>
    </div>

    <!-- Load more -->
    <div id="load-more-wrapper" class="hidden text-center pb-6">
        <button id="load-more-btn" class="text-sm text-indigo-600 hover:text-indigo-800 px-4 py-2 rounded-lg hover:bg-indigo-50 transition-colors">
            Load more
        </button>
    </div>

    <!-- Empty state -->
    <div id="notif-empty" class="hidden py-16 text-center">
        <svg class="w-12 h-12 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
        </svg>
        <p class="text-gray-400 text-sm">No notifications yet</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(function () {
    "use strict";

    var currentFilter = "all";
    var offset = 0;
    var limit = 20;
    var total = 0;

    function escapeHtml(str) { return $("<div>").text(str || "").html(); }

    function relativeTime(iso) {
        var d = new Date(iso + (iso.endsWith("Z") ? "" : "Z"));
        var now = new Date();
        var diff = Math.floor((now - d) / 1000);
        if (diff < 60) return "just now";
        if (diff < 3600) return Math.floor(diff / 60) + "m ago";
        if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
        return Math.floor(diff / 86400) + "d ago";
    }

    var typeLabels = {
        task_due: { label: "Task Due", cls: "bg-amber-100 text-amber-700" },
        task_overdue: { label: "Overdue", cls: "bg-red-100 text-red-700" },
        session_reminder: { label: "Session", cls: "bg-indigo-100 text-indigo-700" },
        semester_alert: { label: "Semester", cls: "bg-emerald-100 text-emerald-700" },
        timer_done: { label: "Timer", cls: "bg-purple-100 text-purple-700" },
    };

    function renderItem(n) {
        var t = typeLabels[n.type] || { label: n.type, cls: "bg-gray-100 text-gray-700" };
        return '<div class="notif-page-item bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex items-start gap-4 transition-all ' + (n.read ? "opacity-60" : "") + '" data-id="' + n.id + '">' +
            '<div class="flex flex-col items-center gap-1 pt-0.5">' +
                '<span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-semibold ' + t.cls + '">' + t.label + '</span>' +
                (!n.read ? '<span class="w-2 h-2 rounded-full bg-indigo-500"></span>' : '') +
            '</div>' +
            '<div class="min-w-0 flex-1">' +
                '<p class="text-sm font-medium text-gray-800">' + escapeHtml(n.title) + '</p>' +
                '<p class="text-sm text-gray-500 mt-0.5">' + escapeHtml(n.message) + '</p>' +
                '<p class="text-xs text-gray-400 mt-1">' + relativeTime(n.created_at) + '</p>' +
            '</div>' +
            '<div class="flex items-center gap-1 shrink-0">' +
                (n.link ? '<a href="' + escapeHtml(n.link) + '" class="text-indigo-500 hover:text-indigo-700 p-1 rounded-lg hover:bg-indigo-50 transition-colors" title="Go">' +
                    '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/></svg>' +
                '</a>' : '') +
                '<button class="notif-delete-btn text-gray-400 hover:text-red-500 p-1 rounded-lg hover:bg-red-50 transition-colors" data-id="' + n.id + '" title="Delete">' +
                    '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>' +
                '</button>' +
            '</div>' +
        '</div>';
    }

    function loadPage(append) {
        var qs = "?limit=" + limit + "&offset=" + offset;
        if (currentFilter === "unread") qs += "&unread_only=true";

        $.getJSON("/api/notifications" + qs, function (resp) {
            total = resp.total;
            var $list = $("#notif-page-list");

            if (!append) $list.empty();

            if (resp.notifications.length === 0 && offset === 0) {
                $list.empty();
                $("#notif-empty").removeClass("hidden");
                $("#load-more-wrapper").addClass("hidden");
                return;
            }

            $("#notif-empty").addClass("hidden");
            resp.notifications.forEach(function (n) {
                $list.append(renderItem(n));
            });

            if (offset + limit < total) {
                $("#load-more-wrapper").removeClass("hidden");
            } else {
                $("#load-more-wrapper").addClass("hidden");
            }
        });
    }

    // Filter tabs
    $(".notif-filter-btn").on("click", function () {
        $(".notif-filter-btn").removeClass("bg-indigo-600 text-white shadow").addClass("text-gray-600 hover:bg-gray-100");
        $(this).addClass("bg-indigo-600 text-white shadow").removeClass("text-gray-600 hover:bg-gray-100");
        currentFilter = $(this).data("filter");
        offset = 0;
        loadPage(false);
    });

    // Load more
    $("#load-more-btn").on("click", function () {
        offset += limit;
        loadPage(true);
    });

    // Mark all read
    $("#mark-all-read-btn").on("click", function () {
        $.ajax({
            url: "/api/notifications/mark-all-read",
            method: "POST",
            success: function () {
                $(".notif-page-item").addClass("opacity-60").find(".bg-indigo-500").remove();
                if (typeof updateBadge === "function") updateBadge(0);
            }
        });
    });

    // Clear read
    $("#clear-read-btn").on("click", function () {
        $.ajax({
            url: "/api/notifications/clear",
            method: "DELETE",
            success: function () {
                offset = 0;
                loadPage(false);
            }
        });
    });

    // Delete single
    $(document).on("click", ".notif-delete-btn", function (e) {
        e.stopPropagation();
        var id = $(this).data("id");
        var $item = $(this).closest(".notif-page-item");
        $.ajax({
            url: "/api/notifications/" + id,
            method: "DELETE",
            success: function () {
                $item.fadeOut(200, function () { $item.remove(); });
            }
        });
    });

    // Click item to mark read
    $(document).on("click", ".notif-page-item", function () {
        var id = $(this).data("id");
        var $item = $(this);
        if (!$item.hasClass("opacity-60")) {
            $.ajax({ url: "/api/notifications/" + id + "/read", method: "PUT" });
            $item.addClass("opacity-60").find(".bg-indigo-500").remove();
        }
    });

    loadPage(false);
});
</script>
{% endblock %}
