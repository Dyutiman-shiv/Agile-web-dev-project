{% extends "layout.html" %}
{% block title %}Scores{% endblock %}

{% block page_content %}
<div class="max-w-6xl mx-auto space-y-6 p-4 sm:p-6">

  <div
    class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 sm:p-6 flex flex-col sm:flex-row sm:items-center gap-3">
    <h3 class="text-lg montserrat-bold text-gray-800 flex items-center gap-2">
      📈 Calculate Your WAM for
    </h3>
    <select id="semester-select" class="w-full sm:w-auto sm:ml-auto px-4 py-2 border border-gray-200 rounded-xl text-sm
         focus:ring-2 focus:ring-indigo-500 focus:outline-none roboto-regular
         relative z-10 bg-white">
      <option>Loading...</option>
    </select>
  </div>

  <div id="units-container" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
  </div>
  
  <div id="no-units-message" class="hidden bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center">
    <h3 class="text-lg montserrat-semi-bold text-gray-500 mb-2">
      No units in this semester yet
    </h3>

    <p class="text-sm roboto-regular text-gray-400 max-w-md mx-auto leading-relaxed">
      Add units in Academic Settings first, then come back here to enter your assessments and calculate your WAM.
    </p>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
    <h3 class="text-lg montserrat-semi-bold text-gray-800 mb-2">
      Overall WAM
    </h3>

    <div class="text-2xl roboto-bold text-indigo-600">
      <span id="overall-wam">0</span>
    </div>
  </div>

</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="{{ url_for('static', filename='js/scores.js') }}"></script>
{% endblock %}
