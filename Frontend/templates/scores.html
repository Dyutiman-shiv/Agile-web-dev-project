{% extends "layout.html" %}
{% block title %}Scores{% endblock %}

{% block page_content %}
<div class="max-w-6xl mx-auto space-y-6 p-6">

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex items-center">
    <h3 class="text-lg font-semibold text-gray-800 flex items-center gap-2">
      📈 Calculate Your WAM for
    </h3>
    <select id="semester-select"
    class="ml-auto px-4 py-2 border border-gray-200 rounded-xl text-sm
         focus:ring-2 focus:ring-indigo-500 focus:outline-none
         relative z-50 bg-white">
    <option>Loading...</option>
    </select>
  </div>

  <div id="units-container"
       class="grid grid-cols-1 sm:grid-cols-2 gap-6">
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
    <h3 class="text-lg font-semibold text-gray-800 mb-2">
      Overall WAM
    </h3>

    <div class="text-2xl font-bold text-indigo-600">
      <span id="overall-wam">0</span>
    </div>
  </div>

</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="{{ url_for('static', filename='js/scores.js') }}"></script>
{% endblock %}
