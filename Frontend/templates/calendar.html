{% extends "layout.html" %}
{% block title %}Calendar{% endblock %}
{% block main_class %}overflow-hidden bg-gray-50{% endblock %}

{% block page_content %}
<div class="flex gap-0 h-full animate-fade-in">

    <!-- ========== LEFT PANEL ========== -->
    <aside id="cal-left-panel" class="hidden lg:flex flex-col shrink-0 border-r border-gray-200 bg-white overflow-y-auto p-5" style="width: clamp(280px, 22vw, 400px);">
        <!-- + Add event button -->
        <button id="add-event-btn" class="w-full mb-5 flex items-center justify-center gap-1.5 px-4 py-2.5 bg-indigo-600 text-white text-sm font-semibold rounded-xl hover:bg-indigo-700 transition-all shadow-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
        </button>

        <!-- Mini Calendar -->
        <div id="mini-calendar" class="mb-5">
            <!-- Rendered by JS -->
        </div>

        <!-- Agenda: Today & Tomorrow -->
        <div id="agenda-panel" class="flex-1 overflow-y-auto">
            <!-- Rendered by JS -->
        </div>
    </aside>

    <!-- ========== RIGHT PANEL ========== -->
    <div class="flex-1 flex flex-col min-w-0 bg-gray-50">
        <!-- Toolbar -->
        <div class="flex items-center justify-between gap-4 px-4 sm:px-6 py-3 bg-white border-b border-gray-200 shrink-0">
            <div class="flex items-center gap-2">
                <button id="cal-today" class="px-4 py-1.5 text-sm font-medium rounded-lg border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 transition-colors">Today</button>
                <button id="cal-prev" class="p-1.5 rounded-lg hover:bg-gray-100 transition-colors text-gray-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
                </button>
                <button id="cal-next" class="p-1.5 rounded-lg hover:bg-gray-100 transition-colors text-gray-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
                </button>
                <h2 id="cal-title" class="ml-2 text-base font-semibold text-gray-800 hidden sm:block"></h2>
            </div>

            <div class="flex items-center gap-1.5">
                <!-- Mobile add button (visible only on small screens) -->
                <button id="add-event-btn-mobile" class="lg:hidden p-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                </button>

                <!-- View switcher -->
                <div class="inline-flex rounded-xl bg-gray-100 p-1">
                    <button class="cal-view-btn px-3 py-1.5 text-xs font-medium rounded-lg transition-all" data-view="day">Day</button>
                    <button class="cal-view-btn px-3 py-1.5 text-xs font-medium rounded-lg transition-all" data-view="week">Week</button>
                    <button class="cal-view-btn px-3 py-1.5 text-xs font-medium rounded-lg transition-all active" data-view="month">Month</button>
                </div>
            </div>
        </div>

        <!-- Calendar grid container -->
        <div id="calendar-container" class="flex-1 bg-white overflow-hidden min-h-0">
            <!-- Rendered by JS -->
        </div>
    </div>
</div>

<!-- Event create/edit modal -->
<div id="event-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 p-6 animate-slide-up">
        <div class="flex items-center justify-between mb-4">
            <h3 id="event-modal-title" class="text-lg font-bold text-gray-800">New Event</h3>
            <button id="event-modal-close" class="p-1 rounded-lg hover:bg-gray-100 transition-colors text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <div id="event-alert"></div>

        <form id="event-form" class="space-y-4">
            <input type="hidden" id="event-id" value="">
            <!-- Type selector -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Type</label>
                <div class="flex gap-2">
                    <button type="button" class="event-type-btn flex-1 px-3 py-2 text-sm font-medium rounded-xl border-2 transition-all" data-type="session">
                        Study Session
                    </button>
                    <button type="button" class="event-type-btn flex-1 px-3 py-2 text-sm font-medium rounded-xl border-2 transition-all" data-type="task">
                        Task
                    </button>
                </div>
            </div>

            <!-- Title -->
            <div>
                <label for="event-title" class="block text-sm font-medium text-gray-700 mb-1.5" id="event-title-label">Subject</label>
                <input type="text" id="event-title" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:bg-white transition-all" placeholder="e.g. Math 101" required>
            </div>

            <!-- Date + Time -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="event-date" class="block text-sm font-medium text-gray-700 mb-1.5">Date</label>
                    <input type="date" id="event-date" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:bg-white transition-all" required>
                </div>
                <div>
                    <label for="event-time" class="block text-sm font-medium text-gray-700 mb-1.5">Time</label>
                    <input type="time" id="event-time" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:bg-white transition-all" required>
                </div>
            </div>

            <!-- Session-specific: duration + color -->
            <div id="session-fields">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="event-duration" class="block text-sm font-medium text-gray-700 mb-1.5">Duration (min)</label>
                        <input type="number" id="event-duration" value="60" min="5" max="480" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:bg-white transition-all">
                    </div>
                    <div>
                        <label for="event-color" class="block text-sm font-medium text-gray-700 mb-1.5">Color</label>
                        <div class="flex gap-2 mt-1" id="color-picker">
                            <button type="button" class="color-dot w-8 h-8 rounded-full border-2 border-transparent hover:scale-110 transition-transform" data-color="#6366f1" style="background:#6366f1"></button>
                            <button type="button" class="color-dot w-8 h-8 rounded-full border-2 border-transparent hover:scale-110 transition-transform" data-color="#ec4899" style="background:#ec4899"></button>
                            <button type="button" class="color-dot w-8 h-8 rounded-full border-2 border-transparent hover:scale-110 transition-transform" data-color="#10b981" style="background:#10b981"></button>
                            <button type="button" class="color-dot w-8 h-8 rounded-full border-2 border-transparent hover:scale-110 transition-transform" data-color="#f59e0b" style="background:#f59e0b"></button>
                            <button type="button" class="color-dot w-8 h-8 rounded-full border-2 border-transparent hover:scale-110 transition-transform" data-color="#ef4444" style="background:#ef4444"></button>
                        </div>
                    </div>
                </div>
                <div class="mt-3">
                    <label for="event-notes" class="block text-sm font-medium text-gray-700 mb-1.5">Notes</label>
                    <textarea id="event-notes" rows="2" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:bg-white transition-all resize-none" placeholder="Optional notes..."></textarea>
                </div>
            </div>

            <!-- Task-specific: description + completed -->
            <div id="task-fields" class="hidden">
                <div>
                    <label for="event-description" class="block text-sm font-medium text-gray-700 mb-1.5">Description</label>
                    <textarea id="event-description" rows="2" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:bg-white transition-all resize-none" placeholder="Optional description..."></textarea>
                </div>
                <div class="mt-3">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="event-completed" class="w-4 h-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-400">
                        <span class="text-sm text-gray-700">Mark as completed</span>
                    </label>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-between pt-2">
                <button type="button" id="event-delete-btn" class="hidden px-4 py-2 text-sm font-medium text-red-600 bg-red-50 rounded-xl hover:bg-red-100 transition-colors">
                    Delete
                </button>
                <div class="flex gap-2 ml-auto">
                    <button type="button" id="event-cancel-btn" class="px-4 py-2 text-sm font-medium text-gray-600 bg-gray-100 rounded-xl hover:bg-gray-200 transition-colors">Cancel</button>
                    <button type="submit" id="event-save-btn" class="px-5 py-2 text-sm font-medium text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors shadow-sm">
                        <span id="event-spinner" class="hidden inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin mr-1 align-middle"></span>
                        Save
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
{% endblock %}
