[pytest]
testpaths = tests
pythonpath = Backend
addopts = -v --tb=short
markers =
    startup: App bootstrap, schema, and static sanity checks (tests/startup_checks)
    unit: Smoke HTTP tests and narrow behaviour checks (tests/unit_testing)
    integration: Multi-step Flask client flows — groups, invites, RBAC (tests/integration_testing)
    e2e: Selenium end-to-end tests that require a live HTTP server and Chrome (tests/selenium_testing)
